name: One-time SDK protocol snapshot sync

on:
  push:
    branches:
      - feature/provider-deployments

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-deployments
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: JarynXu/okf-sdk
          ref: main
          path: .sdk-sync
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Sync protocol snapshot and verify
        shell: bash
        run: |
          set -euo pipefail
          cp .sdk-sync/src/provider_protocol.rs vendor/okf/src/provider_protocol.rs
          rm -rf .sdk-sync
          cargo fmt --all
          cargo test --all-features
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/okf/src/provider_protocol.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync provider protocol SDK snapshot"
          git push origin HEAD:feature/provider-deployments
