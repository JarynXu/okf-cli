name: One-time provider repair

on:
  push:
    branches:
      - feature/provider-deployments

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-deployments
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: JarynXu/okf-sdk
          ref: feature/provider-adapters
          path: .sdk-sync
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Repair SDK snapshot and borrow lifetime
        shell: bash
        run: |
          cp .sdk-sync/src/providers.rs vendor/okf/src/providers.rs
          rm -rf .sdk-sync
          python - <<'PY'
          from pathlib import Path

          path = Path("src/libraries.rs")
          text = path.read_text()
          old = '''    entry.mounted = mounted;
              save_registry(registry_path, &registry)?;

              Outcome::success(
          '''
          new = '''    entry.mounted = mounted;
              let provider_authorizations = entry.approved_provider_kinds.clone();
              save_registry(registry_path, &registry)?;

              Outcome::success(
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif "let provider_authorizations = entry.approved_provider_kinds.clone();" not in text:
              raise SystemExit("set_mounted patch anchor not found")

          old = '            "provider_authorizations": entry.approved_provider_kinds,\n'
          new = '            "provider_authorizations": provider_authorizations,\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif '            "provider_authorizations": provider_authorizations,\n' not in text:
              raise SystemExit("authorization output patch anchor not found")
          path.write_text(text)
          PY
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: complete provider deployment integration"
          git push origin HEAD:feature/provider-deployments
