name: Native distribution binaries

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-binaries-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: npm-${{ matrix.target }}
      - run: cargo build --profile dist --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/dist/okf.exe" artifact/okf.exe
          else
            cp "target/$TARGET/dist/okf" artifact/okf
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 7
